global:
  resolve_timeout: 10m

route:
  receiver: finance-daily-summary
  group_by: [alertname, domain, group_id, supplier_id, month]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: finance-critical
      group_wait: 0s
      repeat_interval: 30m
      continue: false
    - matchers:
        - severity="high"
      receiver: finance-high
      group_wait: 30s
      repeat_interval: 2h
      continue: false
    - matchers:
        - severity="warning"
      receiver: finance-review
      group_wait: 5m
      repeat_interval: 24h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"high|warning"
    equal: [domain, group_id, supplier_id, month]

receivers:
  - name: finance-critical
    # 由部署环境以安全方式注入目标；不得将Webhook、token、手机号写入仓库。
    webhook_configs:
      - url: "http://finance-alert-router.internal/v1/critical"
        send_resolved: true
  - name: finance-high
    webhook_configs:
      - url: "http://finance-alert-router.internal/v1/high"
        send_resolved: true
  - name: finance-review
    webhook_configs:
      - url: "http://finance-alert-router.internal/v1/review"
        send_resolved: true
  - name: finance-daily-summary
    webhook_configs:
      - url: "http://finance-alert-router.internal/v1/daily-summary"
        send_resolved: false

templates:
  - "/etc/alertmanager/templates/*.tmpl"
