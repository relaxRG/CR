name: iOS Crash Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'app.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/run-ios-crash-smoke.sh'
      - '.github/workflows/ios-crash-smoke.yml'

concurrency:
  group: ios-crash-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-simulator-cold-start:
    # The repository's available macOS-14 pool is schedulable. Select an installed Xcode 16+
    # explicitly instead of relying on the runner default (which can still point to Xcode 15.4).
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Select React Native compatible Xcode
        run: |
          for app in /Applications/Xcode*.app; do
            developer_dir="$app/Contents/Developer"
            version="$($developer_dir/usr/bin/xcodebuild -version | awk 'NR == 1 { print $2 }')"
            case "$version" in
              16.*|17.*|18.*|19.*|2[0-9].*)
                echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
                echo "Selected $app (Xcode $version)"
                exit 0
                ;;
            esac
          done
          echo "React Native 0.81 requires Xcode 16.1 or newer; installed Xcode versions:" >&2
          ls -1 /Applications/Xcode*.app >&2 || true
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and cold-launch iOS simulator five times
        env:
          IOS_SMOKE_RUN_COUNT: '5'
          ARTIFACT_DIR: artifacts/ios-crash-smoke
        run: bash scripts/ci/run-ios-crash-smoke.sh
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-crash-smoke-evidence
          path: artifacts/ios-crash-smoke/**
          if-no-files-found: warn
